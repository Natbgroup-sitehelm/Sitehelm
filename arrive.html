<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Arrived? Find Your Booking</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOCIgZmlsbD0iIzFCNDMzMiIvPjxwYXRoIGQ9Ik0xNiA0IEMxNiA0IDYgMTAgNiAyMCBDNiAyNiAxMCAyOCAxNiAyOCBDMjIgMjggMjYgMjYgMjYgMjAgQzI2IDEwIDE2IDQgMTYgNCBaIiBmaWxsPSIjNTJCNzg4Ii8+PC9zdmc+">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#f4f7f5; color:#1a2e24; min-height:100vh; }

  .hero { background:linear-gradient(150deg,#1B4332,#2D6A4F); padding:32px 20px 28px; text-align:center; }
  .hero-logo { font-size:36px; margin-bottom:8px; }
  .hero h1 { font-size:24px; font-weight:900; color:#fff; margin-bottom:4px; }
  .hero .sub { font-size:13px; color:#74c69d; }

  .container { max-width:480px; margin:0 auto; padding:20px 16px; }

  .card { background:#fff; border-radius:16px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,0.06); border:1px solid #e8efe8; margin-bottom:14px; }

  label { display:block; font-size:11px; font-weight:700; color:#52B788; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px; }

  input[type=text], input[type=date], input[type=tel] {
    width:100%; padding:13px 14px; border:2px solid #e0ede8; border-radius:10px;
    background:#fff; color:#1a2e24; font-size:15px; outline:none; transition:border 0.2s;
    font-family:inherit;
  }
  input:focus { border-color:#52B788; }

  .search-btn {
    width:100%; padding:16px; border:none; border-radius:12px;
    background:linear-gradient(135deg,#52B788,#2D6A4F); color:#fff;
    font-size:17px; font-weight:800; cursor:pointer; margin-top:8px;
    transition:transform 0.1s;
  }
  .search-btn:active { transform:scale(0.98); }

  .result-card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.08); border:1px solid #e8efe8; margin-bottom:12px; }
  .result-hero { background:linear-gradient(135deg,#1B4332,#2D6A4F); padding:16px 18px; }
  .result-name { font-size:18px; font-weight:900; color:#fff; margin-bottom:2px; }
  .result-site { font-size:13px; color:#a7d4bc; }
  .result-body { padding:14px 16px; }
  .result-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f4f7f5; font-size:13px; }
  .result-row:last-child { border-bottom:none; }
  .result-label { color:#74c69d; font-weight:600; font-size:12px; }
  .result-val { font-weight:700; color:#1a2e24; }

  .checkin-btn {
    display:block; width:100%; padding:16px; border:none; border-radius:12px;
    background:linear-gradient(135deg,#52B788,#2D6A4F); color:#fff;
    font-size:16px; font-weight:800; cursor:pointer; text-align:center;
    margin-top:12px; transition:transform 0.1s;
  }
  .checkin-btn:active { transform:scale(0.98); }
  .checkin-btn.already { background:#e8f5e9; color:#2D6A4F; border:2px solid #52B788; cursor:default; }

  .error-box { background:#fff3e0; border:1px solid #ff9800; border-radius:12px; padding:16px; text-align:center; }
  .error-box .icon { font-size:36px; margin-bottom:8px; }
  .error-box p { font-size:13px; color:#e65100; line-height:1.5; }

  .help-box { background:#e3f2fd; border:1px solid #90caf9; border-radius:12px; padding:14px 16px; text-align:center; }
  .help-box p { font-size:13px; color:#1565c0; line-height:1.5; }
  .help-box a { color:#1B4332; font-weight:700; }

  .wifi-box { background:#f8fdf9; border:1px solid #d4eddf; border-radius:12px; padding:14px 16px; margin-top:10px; }
  .wifi-label { font-size:10px; font-weight:700; color:#52B788; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:8px; }
  .wifi-row { display:flex; justify-content:space-between; padding:6px 0; font-size:13px; }
  .wifi-key { color:#74c69d; font-weight:600; font-size:12px; }
  .wifi-val { font-weight:700; font-size:14px; letter-spacing:1px; color:#1B4332; }

  .success-screen { text-align:center; padding:24px 20px; }
  .success-screen .big-icon { font-size:64px; margin-bottom:16px; }
  .success-screen h2 { font-size:24px; font-weight:900; color:#1B4332; margin-bottom:8px; }
  .success-screen p { font-size:14px; color:#4b5563; line-height:1.6; }

  .footer { text-align:center; padding:24px 16px; font-size:11px; color:#74c69d; }

  #results { margin-top:4px; }
  .loading { text-align:center; padding:20px; color:#74c69d; font-size:14px; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-logo">🌿</div>
  <h1 id="park-title">Welcome!</h1>
  <div class="sub" id="park-sub">Find your booking to check in</div>
</div>

<div class="container">

  <!-- Search form -->
  <div class="card" id="search-section">
    <p style="font-size:13px;color:#4b5563;margin-bottom:16px;line-height:1.5">
      Enter your surname and arrival date to find your booking and check yourself in.
    </p>

    <div style="margin-bottom:12px">
      <label>Your Surname</label>
      <input type="text" id="search-name" placeholder="e.g. Thompson" autocomplete="family-name"
        oninput="clearResults()" onkeydown="if(event.key==='Enter') doSearch()">
    </div>

    <div style="margin-bottom:4px">
      <label>Arrival Date</label>
      <input type="date" id="search-date" oninput="clearResults()">
    </div>

    <button class="search-btn" onclick="doSearch()">🔍 Find My Booking</button>
  </div>

  <!-- Results -->
  <div id="results"></div>

  <!-- Help -->
  <div class="help-box" id="help-box" style="display:none">
    <p>Can't find your booking? <br>
    <strong id="help-phone"></strong><br>
    <span style="font-size:12px;opacity:0.8">Or check your email for your booking confirmation.</span></p>
  </div>

  <!-- What's On -->
  <div class="card" id="whats-on-card" style="display:none">
    <div style="font-size:11px;font-weight:700;color:#52B788;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px">📆 What's On</div>
    <div id="whats-on-list"></div>
  </div>

</div>

<div class="footer">Powered by SiteHelm · sitehelm.com.au</div>

<script>
// ── Load data ─────────────────────────────────────────────────
function getParkData() {
  try {
    const parks = JSON.parse(localStorage.getItem('parks') || '[]');
    const activeId = localStorage.getItem('activeParkId');
    const park = parks.find(p => p.id === activeId) || parks[0] || { name: 'Your Park', id: 'park1' };
    const info = JSON.parse(localStorage.getItem('park_info_' + park.id) || '{}');
    return { park, info };
  } catch(e) { return { park: { name: 'Your Park', id: 'park1' }, info: {} }; }
}

function getBookings() {
  try { return JSON.parse(localStorage.getItem('bookings_cache') || '[]'); }
  catch(e) { return []; }
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}

function nights(ci, co) {
  return Math.round((new Date(co) - new Date(ci)) / 86400000);
}

function getSiteType(siteId) {
  try {
    const sites = JSON.parse(localStorage.getItem('custom_sites') || localStorage.getItem('site_manager_data') || '[]');
    const site = sites.find(s => s.id === siteId || s.label === siteId);
    const types = {
      powered:   { icon:'⚡', label:'Powered Site' },
      unpowered: { icon:'🏕️', label:'Unpowered Site' },
      ensuite:   { icon:'🚿', label:'Ensuite Site' },
      cabin:     { icon:'🏠', label:'Cabin' },
      glamping:  { icon:'🌟', label:'Glamping' },
    };
    return (site && types[site.type]) || { icon:'⛺', label:'Site' };
  } catch(e) { return { icon:'⛺', label:'Site' }; }
}

// ── Init ──────────────────────────────────────────────────────
const { park, info } = getParkData();
document.getElementById('park-title').textContent = park.name || 'Welcome!';

const phone = info.phone || '';
const gateCode = info.gateCode || '';

if (phone) {
  const helpBox = document.getElementById('help-box');
  const helpPhone = document.getElementById('help-phone');
  helpPhone.innerHTML = `Need help? Call us: <a href="tel:${phone}">${phone}</a>`;
}

// Set today as default date
const today = new Date().toISOString().split('T')[0];
document.getElementById('search-date').value = today;

// ── What's On (gate-noticeboard events) ─────────────────────────
function renderWhatsOn() {
  const EVENT_CAT_ICONS = { activity:'🎉', community:'🍖', kids:'🧒', closure:'🚧', market:'🛍️', other:'📌' };
  let events = [];
  try { events = JSON.parse(localStorage.getItem('sitehelm_events') || '[]'); } catch(e) { events = []; }

  const upcoming = events
    .filter(e => e.showOnNoticeboard && (e.endDate || e.date) >= today)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, 5);

  const card = document.getElementById('whats-on-card');
  const list = document.getElementById('whats-on-list');
  if (!upcoming.length) { card.style.display = 'none'; return; }

  card.style.display = 'block';
  list.innerHTML = upcoming.map((e, i) => {
    const icon = EVENT_CAT_ICONS[e.category] || '📌';
    const dateRange = e.endDate && e.endDate !== e.date ? `${fmtDate(e.date)} → ${fmtDate(e.endDate)}` : fmtDate(e.date);
    const timeStr = e.allDay ? '' : [e.startTime, e.endTime].filter(Boolean).join(' – ');
    const borderStyle = i === upcoming.length - 1 ? '' : 'border-bottom:1px solid #f4f7f5;';
    return `<div style="display:flex;gap:10px;padding:8px 0;${borderStyle}">
      <div style="font-size:20px;flex-shrink:0">${icon}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:800;color:#1a2e24">${e.title}</div>
        <div style="font-size:12px;color:#74c69d;margin-top:1px">${dateRange}${timeStr?` · ${timeStr}`:''}${e.location?` · 📍 ${e.location}`:''}</div>
      </div>
    </div>`;
  }).join('');
}
renderWhatsOn();

// ── Search ────────────────────────────────────────────────────
function clearResults() {
  document.getElementById('results').innerHTML = '';
  document.getElementById('help-box').style.display = 'none';
}

function doSearch() {
  const nameInput = document.getElementById('search-name').value.trim().toLowerCase();
  const dateInput = document.getElementById('search-date').value;
  const results   = document.getElementById('results');

  if (!nameInput) {
    results.innerHTML = `<div class="error-box"><div class="icon">👤</div><p>Please enter your surname to search.</p></div>`;
    return;
  }
  if (!dateInput) {
    results.innerHTML = `<div class="error-box"><div class="icon">📅</div><p>Please select your arrival date.</p></div>`;
    return;
  }

  results.innerHTML = '<div class="loading">🔍 Searching...</div>';

  const bookings = getBookings();

  // Match by surname and arrival date (±1 day for flexibility)
  const checkDate = new Date(dateInput);
  const matches = bookings.filter(b => {
    if (b.status === 'cancelled') return false;
    const nameParts = (b.guest || '').toLowerCase().split(' ');
    const nameMatch = nameParts.some(part => part.startsWith(nameInput) || nameInput.startsWith(part));
    const bDate = new Date(b.checkIn);
    const dayDiff = Math.abs((bDate - checkDate) / 86400000);
    return nameMatch && dayDiff <= 1;
  });

  if (!matches.length) {
    results.innerHTML = `
      <div class="error-box">
        <div class="icon">🔍</div>
        <p>No booking found for <strong>${nameInput}</strong> arriving ${fmtDate(dateInput)}.<br><br>
        Check your surname spelling and arrival date, or contact reception.</p>
      </div>`;
    document.getElementById('help-box').style.display = 'block';
    return;
  }

  results.innerHTML = matches.map(b => renderResult(b)).join('');
}

function renderResult(b) {
  const siteType = getSiteType(b.siteId);
  const n = nights(b.checkIn, b.checkOut);
  const alreadyIn = b.status === 'checked-in';
  const wifi = info.wifiName || '';
  const pass = info.wifiPass || '';
  const today = new Date().toISOString().split('T')[0];
  const canCheckIn = b.checkIn <= today && b.checkOut > today && !alreadyIn;

  const btnHtml = alreadyIn
    ? `<button class="checkin-btn already" disabled>✅ Already Checked In</button>`
    : canCheckIn
    ? `<button class="checkin-btn" onclick="doCheckIn('${b.id}')">🏕️ I've Arrived — Check Me In</button>`
    : `<button class="checkin-btn already" disabled>⏰ Check-in is on ${fmtDate(b.checkIn)}</button>`;

  return `
    <div class="result-card" id="result-${b.id}">
      <div class="result-hero">
        <div class="result-name">${b.guest}</div>
        <div class="result-site">${siteType.icon} ${b.siteId} — ${siteType.label}</div>
      </div>
      <div class="result-body">
        <div class="result-row">
          <span class="result-label">Check In</span>
          <span class="result-val">${fmtDate(b.checkIn)}</span>
        </div>
        <div class="result-row">
          <span class="result-label">Check Out</span>
          <span class="result-val">${fmtDate(b.checkOut)}</span>
        </div>
        <div class="result-row">
          <span class="result-label">Length of Stay</span>
          <span class="result-val">${n} night${n!==1?'s':''}</span>
        </div>
        ${b.guests ? `<div class="result-row">
          <span class="result-label">Guests</span>
          <span class="result-val">${b.guests} adult${b.guests!==1?'s':''}${b.children>0?' + '+b.children+' child'+(b.children!==1?'ren':''):''}</span>
        </div>` : ''}

        ${gateCode ? `
        <div style="background:#fff8e1;border:1px solid #fde68a;border-radius:10px;padding:12px;margin-top:10px;text-align:center">
          <div style="font-size:10px;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px">🚪 Gate Entry Code</div>
          <div style="font-size:28px;font-weight:900;color:#1B4332;letter-spacing:6px">${gateCode}</div>
        </div>` : ''}

        ${btnHtml}

        ${wifi && canCheckIn ? `
        <div class="wifi-box">
          <div class="wifi-label">📶 WiFi — Connect when you're on site</div>
          <div class="wifi-row"><span class="wifi-key">Network</span><span class="wifi-val">${wifi}</span></div>
          <div class="wifi-row"><span class="wifi-key">Password</span><span class="wifi-val">${pass}</span></div>
        </div>` : ''}

        ${phone ? `
        <div style="text-align:center;margin-top:12px">
          <a href="tel:${phone}" style="font-size:13px;color:#74c69d;text-decoration:none">📞 Need help? Call ${phone}</a>
        </div>` : ''}
      </div>
    </div>`;
}

// ── Check In ──────────────────────────────────────────────────
function doCheckIn(bookingId) {
  const btn = document.querySelector(`#result-${bookingId} .checkin-btn`);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Checking you in...'; }

  // Update booking in localStorage
  try {
    const all = JSON.parse(localStorage.getItem('bookings_cache') || '[]');
    const idx = all.findIndex(b => b.id === bookingId);
    if (idx !== -1) {
      all[idx].status = 'checked-in';
      all[idx].selfCheckedIn = true;
      all[idx].checkinTime = new Date().toISOString();
      localStorage.setItem('bookings_cache', JSON.stringify(all));
    }
  } catch(e) {}

  // Write pending for main app to pick up
  localStorage.setItem('sitehelm_selfcheckin_pending', JSON.stringify({
    bookingId,
    token: 'gate-lookup',
    timestamp: new Date().toISOString(),
    selfCheckedIn: true,
  }));

  // Show success after delay
  setTimeout(() => showSuccess(bookingId), 1000);
}

function showSuccess(bookingId) {
  const bookings = getBookings();
  const b = bookings.find(x => x.id === bookingId) || {};
  const wifi = info.wifiName || '';
  const pass = info.wifiPass || '';
  const siteType = getSiteType(b.siteId || '');

  document.getElementById('search-section').style.display = 'none';
  document.getElementById('results').innerHTML = `
    <div style="text-align:center;padding:24px 0 16px">
      <div style="font-size:64px;margin-bottom:12px">🎉</div>
      <h2 style="font-size:24px;font-weight:900;color:#1B4332;margin-bottom:6px">You're checked in!</h2>
      <p style="font-size:14px;color:#4b5563;line-height:1.6;margin-bottom:20px">
        Welcome, ${b.guest?.split(' ')[0] || 'Guest'}!<br>
        Head to <strong style="color:#1B4332">${siteType.icon} ${b.siteId}</strong> and settle in.
      </p>
    </div>

    ${wifi ? `
    <div class="wifi-box">
      <div class="wifi-label">📶 WiFi Details</div>
      <div class="wifi-row"><span class="wifi-key">Network</span><span class="wifi-val">${wifi}</span></div>
      <div class="wifi-row"><span class="wifi-key">Password</span><span class="wifi-val">${pass}</span></div>
    </div>` : ''}

    <div class="card" style="margin-top:14px;text-align:center">
      <div style="font-size:14px;font-weight:700;color:#1B4332;margin-bottom:4px">Check-out is by 10:00am</div>
      <div style="font-size:12px;color:#74c69d">on ${fmtDate(b.checkOut || '')}</div>
    </div>

    ${phone ? `
    <div style="text-align:center;margin-top:16px">
      <a href="tel:${phone}" style="display:inline-block;background:#1B4332;color:#fff;text-decoration:none;padding:12px 28px;border-radius:30px;font-size:14px;font-weight:700">📞 Call Reception — ${phone}</a>
    </div>` : ''}
  `;
  document.getElementById('help-box').style.display = 'none';
}
</script>
</body>
</html>
